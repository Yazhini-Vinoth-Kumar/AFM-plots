
<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>AFM Dashboard</title>


<script
    src="https://cdn.plot.ly/plotly-2.35.2.min.js">
</script>


<style>

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f5f7;
    color: #202124;
}


header {
    background: white;
    border-bottom: 1px solid #dddddd;
    padding: 18px 28px;
}


header h1 {
    margin: 0;
    font-size: 24px;
}


header p {
    margin: 6px 0 0 0;
    color: #666666;
}


.controls {
    background: white;
    margin: 20px;
    padding: 18px;
    border-radius: 8px;
}


.control-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 12px;
}


label {
    font-weight: 600;
}


select,
input,
button {
    font-size: 14px;
    padding: 8px 10px;
}


select {
    min-width: 300px;
}


button {
    cursor: pointer;
}


.main-layout {
    display: grid;
    grid-template-columns: minmax(600px, 1fr) 280px;
    gap: 20px;
    margin: 20px;
}


.card {
    background: white;
    border-radius: 8px;
    padding: 16px;
}


#plot {
    width: 100%;
    height: 620px;
}


.value-card h2 {
    margin-top: 0;
}


.parameter {
    margin-bottom: 24px;
}


.parameter-name {
    color: #666666;
    font-size: 14px;
}


.parameter-value {
    font-size: 24px;
    margin-top: 4px;
}


.parameter-unit {
    color: #555555;
    margin-top: 2px;
}


.metadata {
    margin-top: 25px;
    font-size: 13px;
    line-height: 1.6;
    overflow-wrap: anywhere;
}


.status-ok {
    color: #18794e;
}


.status-error {
    color: #b3261e;
}


.table-card {
    margin: 20px;
}


.table-wrapper {
    overflow-x: auto;
    max-height: 600px;
    overflow-y: auto;
}


table {
    width: 100%;
    border-collapse: collapse;
}


th,
td {
    padding: 9px 12px;
    border-bottom: 1px solid #e5e5e5;
    text-align: left;
}


th {
    position: sticky;
    top: 0;
    background: white;
    z-index: 2;
}


tbody tr {
    cursor: pointer;
}


tbody tr:hover {
    background: #f1f3f4;
}


tbody tr.selected {
    background: #e8f0fe;
}


#loading {
    color: #555555;
    margin-left: 10px;
}


.counter {
    color: #555555;
}


@media (max-width: 900px) {

    .main-layout {
        grid-template-columns: 1fr;
    }

    #plot {
        height: 500px;
    }
}

</style>

</head>


<body>


<header>

    <h1>
        AFM Force Indentation Dashboard
    </h1>

    <p>
        Approach, retract and mechanical parameters
    </p>

</header>


<div class="controls">


    <div class="control-row">

        <label for="folderSelect">
            Folder
        </label>

        <select id="folderSelect"></select>

        <span id="loading"></span>

    </div>


    <div class="control-row">

        <label for="curveSelect">
            Curve
        </label>

        <select id="curveSelect"></select>

    </div>


    <div class="control-row">

        <button id="previousButton">
            Previous
        </button>

        <button id="nextButton">
            Next
        </button>

        <span
            class="counter"
            id="curveCounter">
        </span>

    </div>


    <div class="control-row">

        <label for="xMin">
            X min (nm)
        </label>

        <input
            id="xMin"
            type="number"
            value="-150"
        >

        <label for="xMax">
            X max (nm)
        </label>

        <input
            id="xMax"
            type="number"
            value="200"
        >

        <button id="applyAxis">
            Apply range
        </button>

    </div>


</div>


<div class="main-layout">


    <div class="card">

        <div id="plot"></div>

    </div>


    <div class="card value-card">

        <h2>
            Curve values
        </h2>


        <div class="parameter">

            <div class="parameter-name">
                kB
            </div>

            <div
                class="parameter-value"
                id="kbValue">
                N/A
            </div>

            <div class="parameter-unit">
                nN/µm
            </div>

        </div>


        <div class="parameter">

            <div class="parameter-name">
                E
            </div>

            <div
                class="parameter-value"
                id="eValue">
                N/A
            </div>

            <div class="parameter-unit">
                MPa
            </div>

        </div>


        <div class="parameter">

            <div class="parameter-name">
                RMS
            </div>

            <div
                class="parameter-value"
                id="rmsValue">
                N/A
            </div>

            <div class="parameter-unit">
                pN
            </div>

        </div>


        <div class="metadata">

            <div>
                <strong>Curve:</strong>
                <span id="curveValue"></span>
            </div>

            <div>
                <strong>Folder:</strong>
                <span id="folderValue"></span>
            </div>

            <div>
                <strong>Excel:</strong>
                <span id="excelValue"></span>
            </div>

            <div>
                <strong>Sheet:</strong>
                <span id="sheetValue"></span>
            </div>

            <div>
                <strong>File:</strong>
                <span id="filenameValue"></span>
            </div>

            <div>
                <strong>Match:</strong>
                <span id="matchValue"></span>
            </div>

        </div>

    </div>


</div>


<div class="card table-card">

    <h2>
        Curves in selected folder
    </h2>

    <div class="table-wrapper">

        <table>

            <thead>

                <tr>

                    <th>Curve</th>

                    <th>kB (nN/µm)</th>

                    <th>E (MPa)</th>

                    <th>RMS (pN)</th>

                    <th>Filename</th>

                </tr>

            </thead>

            <tbody id="curveTableBody"></tbody>

        </table>

    </div>

</div>


<script>


// ============================================================
// GLOBAL STATE
// ============================================================

let manifest = [];

let currentFolderData = null;

let folderCache = {};


// ============================================================
// ELEMENTS
// ============================================================

const folderSelect =
    document.getElementById("folderSelect");

const curveSelect =
    document.getElementById("curveSelect");

const loading =
    document.getElementById("loading");

const xMin =
    document.getElementById("xMin");

const xMax =
    document.getElementById("xMax");

const curveCounter =
    document.getElementById("curveCounter");

const kbValue =
    document.getElementById("kbValue");

const eValue =
    document.getElementById("eValue");

const rmsValue =
    document.getElementById("rmsValue");

const curveValue =
    document.getElementById("curveValue");

const folderValue =
    document.getElementById("folderValue");

const excelValue =
    document.getElementById("excelValue");

const sheetValue =
    document.getElementById("sheetValue");

const filenameValue =
    document.getElementById("filenameValue");

const matchValue =
    document.getElementById("matchValue");

const tableBody =
    document.getElementById("curveTableBody");


// ============================================================
// FORMAT NUMBER
// ============================================================

function formatNumber(
    value,
    digits
) {

    if (
        value === null ||
        value === undefined ||
        Number.isNaN(Number(value))
    ) {

        return "N/A";
    }


    return Number(value).toFixed(
        digits
    );
}


// ============================================================
// LOAD MANIFEST
// ============================================================

async function loadManifest() {

    const response = await fetch(
        "data/manifest.json"
    );


    if (!response.ok) {

        throw new Error(
            "Could not load data/manifest.json"
        );
    }


    manifest = await response.json();


    folderSelect.innerHTML = "";


    manifest.forEach(entry => {

        const option =
            document.createElement(
                "option"
            );


        option.value =
            entry.folder;


        option.textContent =
            `${entry.folder} (${entry.count} curves)`;


        folderSelect.appendChild(
            option
        );

    });
}


// ============================================================
// LOAD ONE FOLDER JSON
// ============================================================

async function loadFolder(
    folderName
) {

    loading.textContent =
        "Loading folder data...";


    // --------------------------------------------------------
    // Use browser memory cache if already loaded
    // --------------------------------------------------------

    if (folderCache[folderName]) {

        currentFolderData =
            folderCache[folderName];

        loading.textContent = "";

        return;
    }


    const manifestEntry =
        manifest.find(
            item =>
                item.folder === folderName
        );


    if (!manifestEntry) {

        throw new Error(
            `Folder not found: ${folderName}`
        );
    }


    const response = await fetch(
        `data/${manifestEntry.file}`
    );


    if (!response.ok) {

        throw new Error(
            `Could not load ${manifestEntry.file}`
        );
    }


    const folderData =
        await response.json();


    folderCache[folderName] =
        folderData;


    currentFolderData =
        folderData;


    loading.textContent = "";
}


// ============================================================
// POPULATE CURVE DROPDOWN
// ============================================================

function populateCurveDropdown() {

    curveSelect.innerHTML = "";


    if (!currentFolderData) {

        return;
    }


    currentFolderData.curves.forEach(
        (curve, index) => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                index;


            option.textContent =
                curve.curve_label;


            curveSelect.appendChild(
                option
            );

        }
    );


    if (
        currentFolderData.curves.length > 0
    ) {

        curveSelect.value = 0;
    }
}


// ============================================================
// BUILD CURVE TABLE
// ============================================================

function buildTable() {

    tableBody.innerHTML = "";


    if (!currentFolderData) {

        return;
    }


    currentFolderData.curves.forEach(
        (curve, index) => {

            const row =
                document.createElement(
                    "tr"
                );


            row.className =
                "data-row";


            row.dataset.index =
                index;


            row.innerHTML = `

                <td>
                    ${curve.curve_label}
                </td>

                <td>
                    ${formatNumber(curve.kB, 3)}
                </td>

                <td>
                    ${formatNumber(curve.E, 3)}
                </td>

                <td>
                    ${formatNumber(curve.RMS, 2)}
                </td>

                <td>
                    ${curve.filename}
                </td>

            `;


            row.addEventListener(
                "click",
                () => {

                    curveSelect.value =
                        index;

                    updatePlot();

                    window.scrollTo({
                        top: 0,
                        behavior: "smooth"
                    });

                }
            );


            tableBody.appendChild(
                row
            );

        }
    );
}


// ============================================================
// HIGHLIGHT SELECTED TABLE ROW
// ============================================================

function highlightSelectedRow(
    selectedIndex
) {

    document
        .querySelectorAll(
            ".data-row"
        )
        .forEach(row => {

            const rowIndex =
                Number(
                    row.dataset.index
                );


            if (
                rowIndex === selectedIndex
            ) {

                row.classList.add(
                    "selected"
                );

            } else {

                row.classList.remove(
                    "selected"
                );
            }

        });
}


// ============================================================
// UPDATE PLOT
// ============================================================

function updatePlot() {

    if (!currentFolderData) {

        return;
    }


    const index =
        Number(
            curveSelect.value
        );


    const curve =
        currentFolderData
            .curves[index];


    if (!curve) {

        return;
    }


    // --------------------------------------------------------
    // Approach
    // --------------------------------------------------------

    const approachTrace = {

        x:
            curve.approach_x,

        y:
            curve.approach_y,

        type:
            "scatter",

        mode:
            "lines",

        name:
            "Approach",

        line: {

            color:
                "black",

            width:
                1.5
        }
    };


    // --------------------------------------------------------
    // Retract
    // --------------------------------------------------------

    const retractTrace = {

        x:
            curve.retract_x,

        y:
            curve.retract_y,

        type:
            "scatter",

        mode:
            "lines",

        name:
            "Retract",

        line: {

            color:
                "red",

            width:
                1.5
        }
    };


    // --------------------------------------------------------
    // Plot layout
    // --------------------------------------------------------

    const layout = {

        title: {

            text:
                `${currentFolderData.folder} | ${curve.curve_label}`
        },

        xaxis: {

            title:
                "Indentation (nm)",

            range: [

                Number(
                    xMin.value
                ),

                Number(
                    xMax.value
                )
            ],

            zeroline:
                true
        },

        yaxis: {

            title:
                "Force (nN)",

            zeroline:
                true,

            autorange:
                true
        },

        legend: {

            x:
                0.02,

            y:
                0.98
        },

        hovermode:
            "closest",

        margin: {

            l:
                80,

            r:
                30,

            t:
                70,

            b:
                70
        }
    };


    // --------------------------------------------------------
    // Plot controls
    // --------------------------------------------------------

    const config = {

        responsive:
            true,

        displaylogo:
            false,

        toImageButtonOptions: {

            format:
                "png",

            filename:
                `${currentFolderData.folder}_${curve.curve_label}`,

            scale:
                2
        }
    };


    // --------------------------------------------------------
    // Draw graph
    // --------------------------------------------------------

    Plotly.react(

        "plot",

        [
            approachTrace,
            retractTrace
        ],

        layout,

        config
    );


    // --------------------------------------------------------
    // Update values
    // --------------------------------------------------------

    kbValue.textContent =
        formatNumber(
            curve.kB,
            3
        );


    eValue.textContent =
        formatNumber(
            curve.E,
            3
        );


    rmsValue.textContent =
        formatNumber(
            curve.RMS,
            2
        );


    curveValue.textContent =
        curve.curve_label;


    folderValue.textContent =
        currentFolderData.folder;


    excelValue.textContent =
        currentFolderData.excel_file
        ?? "N/A";


    sheetValue.textContent =
        currentFolderData.sheet
        ?? "N/A";


    filenameValue.textContent =
        curve.filename;


    matchValue.textContent =
        curve.match_status;


    if (
        curve.match_status === "OK"
    ) {

        matchValue.className =
            "status-ok";

    } else {

        matchValue.className =
            "status-error";
    }


    // --------------------------------------------------------
    // Curve counter
    // --------------------------------------------------------

    curveCounter.textContent =

        `Curve ${index + 1} of `

        +

        `${currentFolderData.curves.length}`;


    // --------------------------------------------------------
    // Highlight table row
    // --------------------------------------------------------

    highlightSelectedRow(
        index
    );
}


// ============================================================
// FOLDER CHANGED
// ============================================================

async function folderChanged() {

    try {

        await loadFolder(
            folderSelect.value
        );


        populateCurveDropdown();


        buildTable();


        updatePlot();

    } catch (error) {

        loading.textContent =
            error.message;

        console.error(
            error
        );
    }
}


// ============================================================
// PREVIOUS CURVE
// ============================================================

function previousCurve() {

    let index =
        Number(
            curveSelect.value
        );


    if (index > 0) {

        index -= 1;

        curveSelect.value =
            index;

        updatePlot();
    }
}


// ============================================================
// NEXT CURVE
// ============================================================

function nextCurve() {

    if (!currentFolderData) {

        return;
    }


    let index =
        Number(
            curveSelect.value
        );


    if (
        index <
        currentFolderData.curves.length - 1
    ) {

        index += 1;

        curveSelect.value =
            index;

        updatePlot();
    }
}


// ============================================================
// EVENT LISTENERS
// ============================================================

folderSelect.addEventListener(

    "change",

    folderChanged
);


curveSelect.addEventListener(

    "change",

    updatePlot
);


document
    .getElementById(
        "previousButton"
    )
    .addEventListener(

        "click",

        previousCurve
    );


document
    .getElementById(
        "nextButton"
    )
    .addEventListener(

        "click",

        nextCurve
    );


document
    .getElementById(
        "applyAxis"
    )
    .addEventListener(

        "click",

        updatePlot
    );


// ============================================================
// START DASHBOARD
// ============================================================

async function startDashboard() {

    try {

        loading.textContent =
            "Loading dashboard...";


        await loadManifest();


        if (
            manifest.length === 0
        ) {

            loading.textContent =
                "No AFM folders found.";

            return;
        }


        folderSelect.value =
            manifest[0].folder;


        await folderChanged();


        loading.textContent = "";

    } catch (error) {

        loading.textContent =
            error.message;

        console.error(
            error
        );
    }
}


startDashboard();


</script>


</body>

</html>
